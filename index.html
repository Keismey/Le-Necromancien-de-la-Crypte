<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #07040b; overflow: hidden; }
  /* pinch-zoom : le zoom à deux doigts reste possible (accessibilité), le glissé à un doigt va au jeu ; repli sur none si inconnu */
  body { touch-action: none; touch-action: pinch-zoom; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; touch-action: pinch-zoom; }
  /* Logo Keismey Studio avant l'écran titre (comme les autres jeux du studio) */
  #studio { position: fixed; inset: 0; background: #000; display: grid; place-items: center; z-index: 90; transition: opacity .6s; }
  #studio img { width: min(56%, 230px); opacity: 0; animation: fin 1s ease .15s forwards; }
  @keyframes fin { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="studio"><img alt="Keismey Studio" src="assets/studio_logo.webp"></div>
<script>
(function () {
  const sp = document.getElementById('studio'); let done = false;
  const hide = e => { if (e) e.preventDefault(); if (done) return; done = true; sp.style.opacity = 0; setTimeout(() => sp.remove(), 600); };
  if (/[?&]nosplash/.test(location.search)) { sp.remove(); return; }
  setTimeout(hide, 2300); sp.addEventListener('pointerdown', hide);
})();
</script>
